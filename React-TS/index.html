      <h1>TSNet-TS — Water Hammer &amp; Hydraulic Transient Simulator</h1>
      <p>
        TSNet-TS (tsnet-ts) is a free online water hammer calculator and transient simulation tool
        for pressure surge and hydraulic transient analysis of water distribution networks. It is a
        TypeScript port of TSNet that runs Method of Characteristics (MOC) pipeline transient
        simulation on EPANET .inp files entirely in your browser.
      </p>
      <p>
        Features include valve closure, pump trip, pipe burst, demand pulse, and surge tank scenarios.
        JavaScript is required to use the interactive simulator.
