name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - name: Test ts-net
        run: bun run --cwd TSNET-TS test

      - name: Build ts-net
        run: bun run --cwd TSNET-TS build

      - name: Build react-ts
        run: bun run --cwd React-TS build
